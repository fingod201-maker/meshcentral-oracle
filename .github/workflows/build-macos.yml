# Build macOS DocumentHelper.pkg via GitHub Actions (macOS runner)
# Trigger manually from the Actions tab, then download the artifact.

name: Build macOS Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: false
        default: '1.4.2'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify meshagent binary
        run: |
          cd mh1
          file meshagent
          # Must be Mach-O universal binary (x86_64 + arm64)

      - name: Build package
        run: |
          cd mh1
          bash build-macos.sh

      - name: Verify package
        run: |
          cd mh1
          ls -la DocumentHelper.pkg
          pkgutil --check-signature DocumentHelper.pkg || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentHelper-macOS
          path: mh1/DocumentHelper.pkg
          retention-days: 30
